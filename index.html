<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#18191B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="分迹" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="description" content="分迹：本地优先的成绩记录、趋势分析与上海中考预估前端应用" />
  <title>分迹 · 成绩记录与趋势</title>
  <script>
    (()=>{try{const prefKey=localStorage.getItem('fenji-theme-preference');const raw=prefKey?null:(localStorage.getItem('score-atlas-v6')||localStorage.getItem('score-atlas-v5')||localStorage.getItem('score-atlas-v4'));const data=raw?JSON.parse(raw):null;const pref=prefKey||data?.settings?.theme||'system';const dark=pref==='dark'||(pref==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.dataset.themePref=pref;}catch(_){}})();
  </script>
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="appShell" class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <span class="brand-mark"><img src="logo.svg" alt="" class="brand-logo" /></span>
        <div class="brand-copy">
          <div class="brand-name">分迹</div>
          <div class="brand-subtitle">Score Atlas</div>
        </div>
      </div>
      <nav id="nav" class="nav-list">
        <button class="nav-item active" data-page="home"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.5 8.3 12l3.4 3.2L20.8 6"/><path d="M16.7 6h4.1v4.1"/></svg></span><span>走向</span></button>
        <button class="nav-item" data-page="scores"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h5M8 17h7"/></svg></span><span>成绩</span></button>
        <button class="nav-item" data-page="trends"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16M6.5 15V9M12 15V5M17.5 15v-3"/></svg></span><span>趋势</span></button>
        <button class="nav-item" data-page="exam"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.8 1.8"/></svg></span><span>中考预备</span></button>
        <button class="nav-item" data-page="profile"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5.5 19c.8-3.2 3-5 6.5-5s5.7 1.8 6.5 5"/></svg></span><span>我的</span></button>
      </nav>
      <div class="sidebar-foot">
        <div class="storage-indicator">
          <span class="status-dot" aria-hidden="true"></span>
          <div><strong>本地优先</strong><small>成绩、设置和快照保存在本设备 IndexedDB</small></div>
        </div>
        <div class="sidebar-version">FENJI / V6.3.1</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-copy">
          <h1 id="pageTitle">走向</h1>
          <p id="pageSubtitle">把每一次考试，连成看得见的进步。</p>
        </div>
        <div class="top-actions">
          <button id="themeToggleBtn" class="icon-btn" title="切换深浅色模式" aria-label="切换深浅色模式">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.4A8 8 0 0 1 8.6 4a8.1 8.1 0 1 0 11.4 11.4Z"/></svg>
          </button>
          <button id="quickExportBtn" class="icon-btn top-export" title="快速导出备份" aria-label="快速导出备份"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 10.5 12 15l4.5-4.5M5 20h14"/></svg></button>
          <button id="addScoreBtn" class="primary-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>记录成绩</span></button>
        </div>
      </header>

      <section id="page-home" class="page active"></section>
      <section id="page-scores" class="page"></section>
      <section id="page-trends" class="page"></section>
      <section id="page-exam" class="page"></section>
      <section id="page-profile" class="page"></section>
    </main>

    <nav class="mobile-nav" aria-label="移动端导航">
      <button class="mobile-nav-item active" data-page="home"><span class="mobile-nav-icon"><svg viewBox="0 0 24 24"><path d="M3 17.5 8.3 12l3.4 3.2L20.8 6"/></svg></span><small>走向</small></button>
      <button class="mobile-nav-item" data-page="scores"><span class="mobile-nav-icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h5"/></svg></span><small>成绩</small></button>
      <button class="mobile-nav-item" data-page="trends"><span class="mobile-nav-icon"><svg viewBox="0 0 24 24"><path d="M4 18h16M6.5 15V9M12 15V5M17.5 15v-3"/></svg></span><small>趋势</small></button>
      <button class="mobile-nav-item" data-page="exam"><span class="mobile-nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.8 1.8"/></svg></span><small>中考</small></button>
      <button class="mobile-nav-item" data-page="profile"><span class="mobile-nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5.5 19c.8-3.2 3-5 6.5-5s5.7 1.8 6.5 5"/></svg></span><small>我的</small></button>
    </nav>
  </div>

  <div id="modalBackdrop" class="modal-backdrop" aria-hidden="true">
    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
  </div>

  <div id="toastStack" class="toast-stack" aria-live="polite"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden />

  <script src="app.js"></script>
</body>
</html>
